syntax = "proto3";

package pathway;

option go_package = "github.com/npclaudiu/pathway/internal/proto";

message Properties {
  map<string, PropertyValue> data = 1;
}

enum NullValue {
  NULL_VALUE = 0;
}

message PropertyValue {
  oneof kind {
    NullValue null_value = 1;
    bool bool_value = 2;
    sint64 int_value = 3;
    uint64 uint_value = 4;
    double double_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    PropertyList list_value = 8;
    PropertyMap map_value = 9;
  }
}

message PropertyList {
  repeated PropertyValue values = 1;
}

message PropertyMap {
  map<string, PropertyValue> values = 1;
}
